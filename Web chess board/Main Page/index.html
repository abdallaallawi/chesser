<script>
    document.addEventListener('DOMContentLoaded', async function() {
        if (!localStorage.getItem('AccessToken') && !localStorage.getItem('RefresherToken')) {
            return;
        }
        const response = await FetchAPI('http://localhost:5084/api/player/username', {
            method: 'GET'
        });

        if (response && response.ok) {
            const data = await response.json();
            console.log(data)
            let usernameCont = document.getElementById('usernameCont');
            usernameCont.style.display = "grid";
            document.getElementById('usernametxt').innerHTML = (data.Username || data.username);
            document.getElementById('usernametxt').dataset.text = (data.Username || data.username);
            let profIcon = document.getElementsByClassName('profileicon')[0];
            profIcon.style.fill = 'black';

        }
        else {
            localStorage.clear();
        }
    });

</script>
